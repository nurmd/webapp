    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e);
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="padding:24px;background:#fff;color:#ba1a1a;font-family:monospace;white-space:pre-wrap;border:1px solid #ffdad6;border-radius:12px;margin:20px;">' +
            '<h3>Application Error</h3>' +
            '<p>' + (e.message || e.toString()) + '</p>' +
            '<small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>' +
            '</div>';
        }
      });
      // Safety auto-dismiss fallback for splashscreen in case app takes longer to load
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('app-splash');
          if (splash && !splash.classList.contains('fade-out')) {
            splash.classList.add('fade-out');
            setTimeout(function() { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 400);
          }
        }, 2500);
      });
    </script>
