<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Cross-platform GST Billing & Accounting Application (Web, Android, iOS, Windows, Linux)" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>GST Billing & Accounting - Vyapar Pro</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0f1d;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0a0f1d;
        color: #f8fafc;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin-bottom: 16px;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e);
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="padding:24px;background:#1e1e2e;color:#ff5555;font-family:monospace;white-space:pre-wrap;">' +
            '<h3>Application Startup Error</h3>' +
            '<p>' + (e.message || e.toString()) + '</p>' +
            '<small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>' +
            '</div>';
        }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-BxOzeGhI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BStZ0wJI.css">
  </head>
  <body>
    <div id="root">
      <div class="app-splash">
        <svg class="splash-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="64" height="64">
          <defs>
            <linearGradient id="sBrand" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0B192C"/>
              <stop offset="100%" stop-color="#1E3A8A"/>
            </linearGradient>
            <linearGradient id="sAccent" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#10B981"/>
              <stop offset="100%" stop-color="#34D399"/>
            </linearGradient>
          </defs>
          <rect width="96" height="96" rx="24" fill="url(#sBrand)"/>
          <path d="M28 28 L48 68 L68 28" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="68" cy="28" r="6" fill="url(#sAccent)"/>
          <path d="M42 48 L48 54 L58 40" fill="none" stroke="url(#sAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-size:18px;font-weight:700;letter-spacing:-0.02em;">GST Billing &amp; Accounting</div>
        <div style="font-size:12px;color:#64748b;margin-top:6px;">Loading Vyapar Fintech Engine...</div>
      </div>
    </div>
  </body>
</html>
