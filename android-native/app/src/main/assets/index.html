    <title>Vyapar Books PRO - GST Billing & Accounting</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f9f9ff;
        color: #111c2d;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f9f9ff;
        color: #111c2d;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        margin-bottom: 16px;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Error caught:', e);
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="padding:24px;background:#fff;color:#ba1a1a;font-family:monospace;white-space:pre-wrap;border:1px solid #ffdad6;border-radius:12px;margin:20px;">' +
            '<h3>Application Error</h3>' +
            '<p>' + (e.message || e.toString()) + '</p>' +
            '<small>' + (e.filename || '') + ':' + (e.lineno || '') + '</small>' +
            '</div>';
        }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-Brj2WZtH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D0rX5e25.css">
  </head>

          <circle cx="68" cy="28" r="6" fill="url(#sAccent)"/>
          <path d="M42 48 L48 54 L58 40" fill="none" stroke="url(#sAccent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:700;color:#111c2d;letter-spacing:-0.02em;">Vyapar Books PRO</div>
        <div style="font-size:12px;color:#006c49;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;">
