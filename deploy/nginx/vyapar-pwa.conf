# /etc/nginx/sites-available/vyapar-pwa.conf
# Vyapar Books PRO - Production PWA Nginx Configuration for Debian Linux

server {
    listen 80;
    listen [::]:80;
    server_name billing.yourdomain.com; # Replace with your domain or server IP

    # Redirect all HTTP requests to HTTPS (Uncomment after SSL setup with Certbot)
    # return 301 https://$host$request_uri;

    root /var/www/vyapar;
    index index.html;

    # Security Headers for PWA
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml
        font/woff2;

    # 1. Critical: Service Worker & Web App Manifest must NEVER be cached long-term
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Type "application/manifest+json";
    }

    # 2. Immutable static hashed assets (Vite content-hashed in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Static Icons & Favicons
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 4. SPA Routing (Single Page Application Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Let's Encrypt / Certbot ACME Challenge (Crucial for SSL verification)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vyapar;
        default_type "text/plain";
        allow all;
    }

    # 6. Deny access to hidden files (.git, .env, etc.) except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

