name: Build & Release PWA for Debian Server

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-pwa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Version & Build Production PWA
        run: |
          bash scripts/generate-version.sh
          npm run build

      - name: Package PWA Tarball
        run: |
          mkdir -p dist-pwa
          tar -czf dist-pwa/vyapar-pwa.tar.gz -C dist .
          cd dist-pwa
          sha256sum vyapar-pwa.tar.gz > vyapar-pwa.tar.gz.sha256
          cd ..

      - name: Extract Version Info
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.pkg_version.outputs.VERSION }}
          name: "Vyapar Books PRO ${{ steps.pkg_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-pwa/vyapar-pwa.tar.gz
            dist-pwa/vyapar-pwa.tar.gz.sha256
            public/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
